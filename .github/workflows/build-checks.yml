name: frontend-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-check:
    name: frontend-check-before-merging
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Optional: Uncomment if you have tests set up (e.g., Vitest or Jest)
      # - name: Test
      #   run: npm run test

  promote-to-production:
    name: promote-to-production
    needs: build-and-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update PR (main → production)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          if ! git ls-remote --exit-code --heads origin production >/dev/null 2>&1; then
            echo "🆕 production branch does not exist — creating it from main."
            git push origin main:production
            echo "✅ production branch created."
            exit 0
          fi

          git fetch origin main production
          DIFF=$(git rev-list --count origin/production..origin/main)
          if [ "$DIFF" -eq 0 ]; then
            echo "✅ production is already up to date with main. Nothing to promote."
            exit 0
          fi
          echo "📦 $DIFF commit(s) to promote from main → production."

          # ─── Build a PR title from the latest commit message ───
          RAW_TITLE=$(git log -1 --pretty=%s origin/main)

          if [ -z "$RAW_TITLE" ]; then
            RAW_TITLE="chore: promote main → production"
          fi

          MAX_LEN=70
          if [ "${#RAW_TITLE}" -gt "$MAX_LEN" ]; then
            PR_TITLE="${RAW_TITLE:0:$((MAX_LEN - 1))}…"
          else
            PR_TITLE="$RAW_TITLE"
          fi

          echo "🏷️  PR title: $PR_TITLE"

          EXISTING_PR=$(gh pr list \
            --base production \
            --head main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "♻️  PR #$EXISTING_PR already exists — updating title."
            gh pr edit "$EXISTING_PR" --title "$PR_TITLE" >/dev/null
            PR_NUMBER=$EXISTING_PR
          else
            PR_URL=$(gh pr create \
              --base production \
              --head main \
              --title "$PR_TITLE" \
              --body "## Automated promotion

          This PR promotes \`main\` to \`production\` for the frontend.

          **Triggered by:** ${{ github.event.head_commit.message }}
          **Commit:** \`${{ github.sha }}\`
          **Author:** @${{ github.actor }}

          ---

          All status checks must pass before this merges.
          Once green, auto-merge will complete automatically.")

            echo "✨ Created PR: $PR_URL"
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          fi

          echo "🔀 Enabling auto-merge on PR #$PR_NUMBER..."
          gh pr merge "$PR_NUMBER" --auto --merge --delete-branch=false || \
            echo "⚠️  Auto-merge could not be enabled (see notes in the workflow)."